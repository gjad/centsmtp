[package]
name = "centsmtp"
version = "0.1.0"
edition = "2021"
description = "SMTP bridge: local SMTP front-end (client) -> encrypted tunnel -> AWS SES relay with archiving (server)"

[lib]
name = "centsmtp"
path = "src/lib.rs"

[[bin]]
name = "centsmtp_server"
path = "src/bin/centsmtp_server.rs"

[[bin]]
name = "centsmtp_client"
path = "src/bin/centsmtp_client.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
bincode = "1.3"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
hickory-resolver = "0.25"
hkdf = "0.12"
hmac = "0.12"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls", "ring", "webpki-roots"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "fs", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
strip = true
